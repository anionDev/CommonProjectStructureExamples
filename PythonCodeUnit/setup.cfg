[metadata]
name = PythonCodeUnit
version = 1.2.0
author = Marius Göcke
author_email = marius.goecke@gmail.com
description = The PythonCodeUnit is a demonstration-codeunit for a Python-package.
long_description = file:ReadMe.md
long_description_content_type = text/markdown
url = https://github.com/anionDev/CommonProjectStructureExamples
classifiers =
    Intended Audience :: Developers
    Topic :: Software Development :: Libraries :: Python Modules
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: POSIX :: Linux
    Operating System :: Microsoft :: Windows :: Windows 10
    Topic :: System :: Archiving :: Packaging
    Topic :: System :: Systems Administration
    Topic :: Terminals
    Topic :: Utilities
keywords = package release build management
project_urls =
    Documentation = https://github.com/anionDev/CommonProjectStructureExamples/blob/main/PythonCodeUnit/Other/Reference/ReferenceContent/index.md
    Changelog = https://github.com/anionDev/CommonProjectStructureExamples/tree/main/Other/Resources/Changelog

[options]
packages = PythonCodeUnit
zip_safe = False
include_package_data = False
python_requires = >=3.10
install_requires =
    ScriptCollection>=3.4.1
[options.packages.find]
exclude = PythonCodeUnitTests

[options.entry_points]
console_scripts =
    executable1 = PythonCodeUnit.Executables:executable_1
    executable2 = PythonCodeUnit.Executables:executable_2
