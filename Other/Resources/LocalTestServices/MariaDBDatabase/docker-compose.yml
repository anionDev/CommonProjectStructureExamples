services:
  commonprojectstructureexamples_mariadb:
    container_name: "commonprojectstructureexamples_mariadb"
    image: ${image_mariadb}
    # The port is published so that the testcases reach the database when they run on the host. Inside the
    # build-container they reach it by the container-name instead, see the test-utilities of the codeunit.
    ports:
      - "3306:3306"
    environment:
      MARIADB_USER: user
      MARIADB_PASSWORD: pa55w0rd
      MARIADB_ROOT_PASSWORD: R00tpa55w0rd
      MARIADB_DATABASE: DotNetWebAPICodeUnitDatabase
    volumes:
      - ./Volumes/MariaDBData:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -pR00tpa55w0rd || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    networks:
      - commonprojectstructureexamples_net

  commonprojectstructureexamples_mariadb_administration:
    container_name: "commonprojectstructureexamples_mariadb_administration"
    image: ${image_adminer}
    ports:
      - "8080:8080"
    depends_on:
      - commonprojectstructureexamples_mariadb
    networks:
      - commonprojectstructureexamples_net

networks:
  commonprojectstructureexamples_net:
    external: true
