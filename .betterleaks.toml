[extend]
useDefault = true

[[allowlists]]
description = "Local development-CA and the certificate which is issued by it. Both are generated by the build (see Other/Scripts/PrepareBuildCodeunits.py), are git-ignored and are only valid for the local test-domain, so they never leave the machine of the developer. A real deployment gets its own certificate. The certificate exists twice because the build copies it from the repository into every codeunit which embeds it."
paths = [
    '''Other/Resources/CA/''',
    '''Other/Resources/DevelopmentCertificate/''',
]

[[allowlists]]
description = "Data-directory of the local test-database. It is created by the database-container while the testcases run, is git-ignored and contains no data of this product: what is reported here is a byte-sequence inside the help-tables which MariaDB itself installs."
paths = [
    '''Other/Resources/LocalTestServices/.*/Volumes/''',
]
