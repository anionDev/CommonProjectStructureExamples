spring.application.name=SpringAPI
server.port=8080

# The major-version of this codeunit is part of the route of the API, so that a breaking change of the API gets a new route.
# The value is inserted by maven when the resources are processed.
springapi.majorversion=@parsedVersion.majorVersion@

# The health-state is provided by spring-boot-actuator. It is mapped to "/HealthCheck", which is the route the
# health-check-endpoint has in the other web-API-codeunits of this repository (for example DotNetWebAPICodeUnit).
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=HealthCheck
management.endpoints.web.exposure.include=health
